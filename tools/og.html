<!doctype html>
<!-- Telegram превью суреті (1200×630). Қайта жасау: README.md қараңыз. -->
<html lang="kk">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Montserrat:wght@200;700;900&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #040d0a; }
  body {
    position: relative; color: #eef7f3; font-family: 'Montserrat', sans-serif;
    background:
      radial-gradient(ellipse 60% 70% at 78% 58%, rgba(47,137,112,.42), transparent 70%),
      radial-gradient(120% 90% at 30% 0%, #0d2a1f 0%, #040d0a 65%);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(155,231,200,.16) 1.2px, transparent 1.6px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse 80% 80% at 60% 55%, #000 30%, transparent 100%);
  }
  svg.garland { position: absolute; top: 0; left: 0; }
  .wire { fill: none; stroke: #23372f; stroke-width: 2; }
  .core { fill: #ffe2a3; }
  .text { position: absolute; left: 84px; top: 170px; }
  .eyebrow { display: flex; align-items: center; gap: 16px; color: #3fd1a0; font-weight: 700; font-size: 18px; letter-spacing: .5em; }
  .eyebrow i { width: 56px; height: 2px; background: #3fd1a0; opacity: .7; }
  h1 { margin-top: 26px; font-weight: 900; font-size: 104px; line-height: .9; letter-spacing: -.04em; }
  .gold {
    background: linear-gradient(180deg, #ffeabb 0%, #f0c06a 48%, #c9973f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .meta { margin-top: 34px; display: flex; gap: 14px; }
  .chip {
    padding: 14px 22px; border-radius: 99px;
    border: 1.5px solid rgba(155,231,200,.22); background: rgba(10,30,24,.6);
    font-weight: 700; font-size: 24px; letter-spacing: .02em;
  }
  .chip.g { border-color: rgba(240,192,106,.55); color: #f0c06a; background: rgba(240,192,106,.08); }
  .place { margin-top: 18px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 22px; color: #8aa69c; }
  .mark { position: absolute; right: 120px; top: 190px; width: 300px; height: 300px; filter: drop-shadow(0 0 60px rgba(63,209,160,.55)); }
  .ring {
    position: absolute; right: 70px; top: 140px; width: 400px; height: 400px;
    border: 2px solid rgba(63,209,160,.45);
    border-radius: 38% 62% 58% 42% / 44% 38% 62% 56%;
  }
  .lock { position: absolute; right: 120px; top: 566px; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 20px; color: #9be7c8; }
</style>
</head>
<body>
  <div class="dots"></div>
  <svg class="garland" id="g" width="1200" height="170" viewBox="0 0 1200 170">
    <defs>
      <radialGradient id="b">
        <stop offset="0" stop-color="#ffe2a3"/>
        <stop offset=".35" stop-color="#f0c06a" stop-opacity=".55"/>
        <stop offset="1" stop-color="#f0c06a" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>
  <div class="ring"></div>
  <svg class="mark" viewBox="0 0 100 100">
    <defs><linearGradient id="e" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5fe0b4"/><stop offset="1" stop-color="#2F8970"/></linearGradient></defs>
    <path d="M6 50 L43 13 Q50 6 57 13 L87 43 Q94 50 87 57 L57 87 Q50 94 43 87 Z" fill="url(#e)"/>
  </svg>
  <div class="text">
    <div class="eyebrow"><i></i>SAPA TEAM</div>
    <h1>TEAM<br><span class="gold">BUILDING</span></h1>
    <div class="meta"><span class="chip g">28.11 · СЕНБІ</span><span class="chip">17:00</span></div>
    <p class="place">Shattyq House, Қаскелең</p>
  </div>
  <p class="lock">🔐 Кодты тап та, шақыруды аш</p>
  <script>
    var g = document.getElementById('g'), NS = 'http://www.w3.org/2000/svg';
    function el(t, a) { var e = document.createElementNS(NS, t); for (var k in a) e.setAttribute(k, a[k]); g.appendChild(e); return e; }
    [[-20, 8, 1220, 30, 80], [-20, 46, 1220, 4, 60]].forEach(function (s, si) {
      var mx = (s[0] + s[2]) / 2, my = (s[1] + s[3]) / 2 + s[4] * 2;
      var p = el('path', { d: 'M' + s[0] + ' ' + s[1] + ' Q' + mx + ' ' + my + ' ' + s[2] + ' ' + s[3], 'class': 'wire' });
      var len = p.getTotalLength(), n = Math.floor(len / 58);
      for (var i = 1; i < n; i++) {
        var q = p.getPointAtLength((len / n) * (i + (si ? .5 : 0)));
        var o = 0.45 + ((i * 37 + si * 11) % 10) / 18;
        el('circle', { cx: q.x, cy: q.y + 10, r: 22, fill: 'url(#b)', opacity: o });
        el('circle', { cx: q.x, cy: q.y + 9, r: 5, 'class': 'core', opacity: o });
      }
    });
  </script>
</body>
</html>
