<!doctype html>
<!-- Telegram превью суреті (1200×630), палитра «Виски». Қайта жасау: README.md қараңыз. -->
<html lang="kk">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Tilt+Neon&display=block" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: 'Montserrat', sans-serif; color: #f5ebde;
    background:
      radial-gradient(ellipse 70% 90% at 30% -10%, rgba(222,128,56,.28), transparent 65%),
      radial-gradient(ellipse 60% 70% at 80% 110%, rgba(120,32,40,.5), transparent 70%),
      radial-gradient(circle, rgba(255,210,160,.05) 1.5px, transparent 2px) 0 0 / 36px 36px,
      #120b08;
  }
  svg.wire { position: absolute; left: 0; top: 0; }
  .bulb {
    position: absolute; width: 12px; height: 16px; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #fffaf0 0 22%, #ffe2ae 45%, #f2ab55 100%);
    box-shadow: 0 0 14px 4px rgba(240,150,60,.42), 0 0 40px 10px rgba(240,150,60,.14);
  }
  .left { position: absolute; left: 96px; top: 170px; display: flex; flex-direction: column; align-items: flex-start; gap: 30px; }
  .neon {
    padding: 26px 34px 20px; border-radius: 34px;
    display: flex; flex-direction: column; align-items: center;
    background: rgba(18,8,6,.35);
    box-shadow: 0 0 0 3px #ff8a7a, 0 0 10px 1px #e0485c, 0 0 36px rgba(214,69,90,.55), inset 0 0 10px rgba(224,72,92,.6), inset 0 0 40px rgba(214,69,90,.2);
  }
  .a { font: 400 132px/0.92 'Tilt Neon', sans-serif; letter-spacing: .06em; padding-left: .06em; color: #ffe6e4;
       text-shadow: 0 0 4px #fff, 0 0 14px #ff7a8a, 0 0 30px #d6455a, 0 0 64px rgba(214,52,72,.6), 0 0 120px rgba(214,52,72,.5); }
  .b { font: 400 71px/1.1 'Tilt Neon', sans-serif; letter-spacing: .08em; padding-left: .08em; color: #fff4dc;
       text-shadow: 0 0 4px #fff, 0 0 14px #ffe2ae, 0 0 30px #f2ab55, 0 0 64px #b0632a, 0 0 120px rgba(176,99,42,.7); }
  .meta { font: 700 34px 'Montserrat', sans-serif; color: #f5ebde; }
  .record {
    position: absolute; right: 110px; top: 150px; width: 330px; height: 330px; border-radius: 50%;
    background: repeating-radial-gradient(circle, #1c1a19 0 1px, #090808 1px 3.2px);
    box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,205,150,.12), 0 0 120px rgba(240,150,60,.24);
  }
  .label {
    position: absolute; left: 105px; top: 105px; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, #9a3040, #6e1c28);
    display: flex; align-items: center; justify-content: center;
    font: 900 26px 'Montserrat', sans-serif; letter-spacing: .06em; color: #ffe2ae;
  }
  .sheen { position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 20deg, transparent 0 18%, rgba(255,220,170,.10) 24%, transparent 30% 68%, rgba(255,220,170,.08) 74%, transparent 80%); }
  .arm { position: absolute; right: 92px; top: 132px; width: 5px; height: 186px; border-radius: 3px;
    background: linear-gradient(#ffe2ae, #b0632a); transform: rotate(24deg); transform-origin: 50% 0; }
</style>
</head>
<body>
  <svg class="wire" width="1200" height="160"><path d="M -10 6 Q 600 150 1210 6" stroke="#3a281e" stroke-width="2" fill="none"/></svg>
  <div id="bulbs"></div>
  <div class="left">
    <div class="neon"><div class="a">TEAM</div><div class="b">BUILDING</div></div>
    <div class="meta">Сапа · 28 қараша · 17:00</div>
  </div>
  <div class="record"><div class="label">САПА</div><div class="sheen"></div></div>
  <script>
    var n = 26, w = 1200, y0 = 6, sag = 144, half = 6, out = '';
    for (var i = 0; i < n; i++) {
      var t = (i + 0.5) / n, u = 1 - t;
      var x = u * u * -10 + 2 * u * t * (w / 2) + t * t * (w + 10);
      var y = u * u * y0 + 2 * u * t * (y0 + sag) + t * t * y0;
      out += '<div class="bulb" style="left:' + Math.round(x - half) + 'px;top:' + Math.round(y + 1) + 'px"></div>';
    }
    document.getElementById('bulbs').innerHTML = out;
  </script>
</body>
</html>
