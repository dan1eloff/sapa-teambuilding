<!doctype html>
<!-- apple-touch-icon (180×180): янтарная сфера -->
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  body { display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(222,128,56,.35), transparent 70%), #120b08; }
  .s {
    width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #fff2d6 0 3%, #ffd086 9%, #f0a046 30%, #b55e1e 58%, #58210b 86%, #290d05 100%);
    box-shadow: inset -12px -16px 32px rgba(50,12,4,.75), inset 0 -6px 14px rgba(255,190,110,.28), inset 8px 10px 18px rgba(255,255,255,.16), 0 12px 36px rgba(240,150,60,.35);
  }
</style></head>
<body><div class="s"></div></body></html>
