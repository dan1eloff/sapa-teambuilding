<!doctype html>
<!-- apple-touch-icon (180×180): сапфировая сфера (палитра «Полночь») -->
<html><head><meta charset="utf-8">
<style>
  * { margin: 0; }
  html, body { width: 180px; height: 180px; overflow: hidden; }
  body { display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(70,100,230,.38), transparent 70%), #070a16; }
  .s {
    width: 116px; height: 116px; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, #f2f6ff 0 3%, #b3c8ff 9%, #6a8ef2 30%, #2f4fbf 58%, #131f5e 86%, #070b26 100%);
    box-shadow: inset -12px -16px 32px rgba(4,8,30,.75), inset 0 -6px 14px rgba(150,190,255,.28), inset 8px 10px 18px rgba(255,255,255,.16), 0 12px 36px rgba(90,130,255,.4);
  }
</style></head>
<body><div class="s"></div></body></html>
