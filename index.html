<!doctype html>
<html lang="kk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Сапа · Тимбилдинг 28.11</title>
  <meta name="description" content="Сапа командасының тимбилдингіне шақыру. Кодты тап та, шақыруды аш!">
  <meta name="theme-color" content="#120b08">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Сапа">
  <meta property="og:title" content="Сапа · Тимбилдинг 28.11">
  <meta property="og:description" content="Кодты тап та, шақыруды аш 🔐">
  <meta property="og:url" content="https://dan1eloff.github.io/sapa-teambuilding/">
  <meta property="og:image" content="https://dan1eloff.github.io/sapa-teambuilding/assets/og.jpg?v=2">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@200;300;400;500;600;700;800;900&family=Tilt+Neon&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="stage-intro">

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="g-off" cx=".4" cy=".3" r=".7">
        <stop offset="0" stop-color="#5a4232"/>
        <stop offset="1" stop-color="#2a1c15"/>
      </radialGradient>
      <radialGradient id="g-on" cx=".5" cy=".38" r=".62">
        <stop offset="0" stop-color="#fffaf0"/>
        <stop offset=".22" stop-color="#fffaf0"/>
        <stop offset=".45" stop-color="#ffe2ae"/>
        <stop offset="1" stop-color="#f2ab55"/>
      </radialGradient>
      <radialGradient id="g-halo">
        <stop offset="0" stop-color="#f0963c" stop-opacity=".55"/>
        <stop offset=".45" stop-color="#f0963c" stop-opacity=".18"/>
        <stop offset="1" stop-color="#f0963c" stop-opacity="0"/>
      </radialGradient>
    </defs>
  </svg>

  <!-- Фон -->
  <div class="bg" aria-hidden="true"></div>
  <svg class="garland" id="garland" data-state="off" aria-hidden="true"></svg>
  <div class="notes" id="notes" aria-hidden="true"></div>
  <canvas class="liquid" id="liquid" aria-hidden="true"></canvas>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <!-- Плеер: название трека + пластинка = кнопка звука -->
  <div class="player" id="player" hidden>
    <div class="now-playing">♪ <span id="trackName"></span></div>
    <button class="vinyl" id="soundBtn" type="button" aria-label="Дыбысты өшіру">
      <span class="vinyl-disc"><span class="vinyl-label"></span></span>
      <span class="vinyl-arm"></span>
    </button>
  </div>

  <main>
    <!-- 1. Кіру -->
    <section class="screen screen-intro is-active" id="intro">
      <h1 class="intro-title">
        <span class="t-thin">САПАЛЫ</span>
        <span class="t-bold">ДЕМАЛЫС</span>
      </h1>
      <button class="orb" id="orb" type="button" aria-label="Сфераны басыңыз"></button>
      <div class="word" id="word" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </section>

    <!-- 2. Код -->
    <section class="screen screen-verify" id="verify">
      <div class="verify-frame">
        <div class="verify-card" id="verifyCard">
          <p class="verify-q" id="question"></p>
          <label class="code" id="codeBox">
            <input class="code-input" id="answer" type="text" inputmode="text" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" maxlength="4" aria-label="Жауап">
            <span class="cell"></span><span class="cell"></span><span class="cell"></span><span class="cell"></span>
          </label>
          <p class="verify-msg" id="verifyMsg" aria-live="polite"></p>
        </div>
      </div>
      <div class="word word-small" id="wordSmall" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    </section>

    <!-- 3. Шақыру -->
    <section class="screen screen-reveal" id="reveal">
      <i class="spot spot-l" aria-hidden="true"></i>
      <i class="spot spot-r" aria-hidden="true"></i>
      <i class="bokeh" style="left:-30px;top:520px;width:120px;height:120px;--a:.10" aria-hidden="true"></i>
      <i class="bokeh" style="right:0;top:760px;width:90px;height:90px;--a:.08" aria-hidden="true"></i>
      <i class="bokeh" style="left:40px;top:1240px;width:70px;height:70px;--a:.07" aria-hidden="true"></i>
      <i class="bokeh" style="right:-40px;top:1500px;width:140px;height:140px;--a:.07" aria-hidden="true"></i>
      <i class="bokeh" style="left:-20px;top:1900px;width:110px;height:110px;--a:.06" aria-hidden="true"></i>

      <header class="hero">
        <div class="neon" id="neon" role="heading" aria-level="2" aria-label="Team building">
          <span class="neon-a">TEAM</span>
          <span class="neon-b">BUILDING</span>
        </div>
        <p class="hero-sub rv">Сапалы отбасы, сенбіде кездесеміз!</p>
      </header>

      <div class="countdown rv" id="countdown">
        <p class="label">БАСТАЛУЫНА ҚАЛДЫ</p>
        <div class="cd-row" id="cdGrid">
          <div class="cd-u"><b data-u="d">00</b><span>КҮН</span></div>
          <i class="cd-sep">:</i>
          <div class="cd-u"><b data-u="h">00</b><span>САҒАТ</span></div>
          <i class="cd-sep">:</i>
          <div class="cd-u"><b data-u="m">00</b><span>МИНУТ</span></div>
          <i class="cd-sep">:</i>
          <div class="cd-u"><b data-u="s">00</b><span>СЕКУНД</span></div>
        </div>
        <p class="cd-done" id="cdDone" hidden></p>
      </div>

      <div class="cards">
        <div class="card-when io">
          <div class="cw-in">
            <div class="cw-col">
              <p class="label">КҮНІ</p>
              <p class="gold-big" id="dateBig"></p>
              <p class="small" id="dateSmall"></p>
            </div>
            <div class="cw-col cw-right">
              <p class="label">УАҚЫТЫ</p>
              <p class="gold-big" id="timeBig"></p>
              <p class="small" id="timeSmall"></p>
            </div>
          </div>
        </div>
        <div class="card card-place io">
          <p class="label">МЕКЕНЖАЙ</p>
          <p class="place-big" id="placeBig"></p>
          <p class="small" id="placeSmall"></p>
          <a class="btn-outline" id="mapBtn" href="#" target="_blank" rel="noopener">2GIS-те ашу</a>
        </div>
        <div class="card card-dress io">
          <div>
            <p class="label">ДРЕСС-КОД</p>
            <p class="dress-big" id="dressBig"></p>
          </div>
          <p class="small" id="dressSmall"></p>
        </div>
      </div>

      <section class="gallery io">
        <div class="gallery-head">
          <p class="label">БІЗ ДЕМАЛАТЫН ОРЫН</p>
          <p class="gallery-count" id="galleryCount">01 / 08</p>
        </div>
        <div class="gallery-track" id="galleryTrack"></div>
        <div class="gallery-dots" id="galleryDots"></div>
      </section>

      <div class="cta-wrap io">
        <button class="cta" id="confirmBtn" type="button"><i class="cta-glint"></i><span>ҚАТЫСУДЫ РАСТАУ</span></button>
      </div>
      <footer class="foot">28 · 11 · 2026</footer>
    </section>

    <!-- 4. Финал -->
    <section class="screen screen-final" id="final">
      <div class="record" aria-hidden="true">
        <div class="record-disc">
          <div class="record-label"><b id="recDate"></b><i></i><span id="recTime"></span></div>
        </div>
        <div class="record-sheen"></div>
        <div class="record-arm"></div>
      </div>
      <h2 class="final-title">СЕНІ КҮТЕМІЗ!</h2>
      <div class="card final-card">
        <p class="final-when" id="finalWhen"></p>
        <p class="small" id="finalWhere"></p>
        <a class="btn-outline" id="mapBtn2" href="#" target="_blank" rel="noopener">2GIS-те ашу</a>
      </div>
      <button class="link-back" id="backBtn" type="button">Басына қайту</button>
    </section>
  </main>

  <div class="boom" id="boom" aria-hidden="true">САПА</div>

  <script src="js/config.js"></script>
  <script src="js/confetti.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/liquid.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
